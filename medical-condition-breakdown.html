<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pneumonia | Medical Term Breakdown</title>
  <style>
    :root {
      color: #183b56;
      background: #f4f8fb;
      font-family: Arial, sans-serif;
      line-height: 1.5;
    }

    body {
      margin: 0;
    }

    main {
      box-sizing: border-box;
      max-width: 720px;
      margin: 0 auto;
      padding: 2rem 1rem 3rem;
    }

    .eyebrow {
      margin: 0 0 0.25rem;
      color: #55758d;
      font-size: 0.85rem;
      font-weight: bold;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #0b5c75;
      font-size: clamp(2rem, 6vw, 3.5rem);
    }

    .intro {
      margin: 0.75rem 0 2rem;
      font-size: 1.2rem;
    }

    form {
      margin-bottom: 1.5rem;
    }

    .search-row {
      display: flex;
      gap: 0.5rem;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .merge-option {
      display: flex;
      align-items: center;
      width: fit-content;
      gap: 0.5rem;
      margin-top: 0.75rem;
      padding: 0.45rem 0.7rem;
      border: 1px solid #c8dce7;
      border-radius: 999px;
      color: #183b56;
      background: #fff;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .options-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.75rem;
    }

    .file-tools {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.75rem;
      padding: 0.75rem;
      border: 1px solid #c8dce7;
      border-radius: 8px;
      background: #eef6f8;
    }

    .file-tools button {
      padding: 0.5rem 0.75rem;
      background: #55758d;
      font-size: 0.9rem;
    }

    .file-tools input[type="file"] {
      flex: 1 1 12rem;
      padding: 0.35rem;
      border: 1px solid #8aaabd;
      background: #fff;
      font-size: 0.9rem;
    }

    .file-tools small {
      flex-basis: 100%;
      color: #55758d;
    }

    input[type="checkbox"] {
      width: auto;
      flex: none;
      margin: 0;
      accent-color: #0b5c75;
    }

    input {
      box-sizing: border-box;
      min-width: 0;
      flex: 1;
      padding: 0.75rem;
      border: 1px solid #8aaabd;
      border-radius: 4px;
      color: inherit;
      font: inherit;
    }

    button {
      padding: 0.75rem 1rem;
      border: 0;
      border-radius: 4px;
      background: #0b5c75;
      color: #fff;
      font: inherit;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #083f51;
    }

    section {
      padding: 1.25rem;
      border: 1px solid #c8dce7;
      border-radius: 8px;
      background: #fff;
    }

    h2 {
      margin-top: 0;
      color: #183b56;
      font-size: 1.25rem;
    }

    .term {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
      margin: 1rem 0 1.5rem;
      font-size: clamp(1.5rem, 5vw, 2.5rem);
      font-weight: bold;
    }

    .segment-display {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 0.2rem;
    }

    .segment-label {
      color: #55758d;
      font-size: 0.65rem;
      font-weight: bold;
      letter-spacing: 0.04em;
      line-height: 1;
      text-transform: uppercase;
    }

    .part {
      padding: 0.35rem 0.6rem;
      border-radius: 4px;
      background: #dceff4;
      color: #0b5c75;
    }

    .unmatched {
      padding: 0.35rem 0.6rem;
      border-radius: 4px;
      background: #f4e8d8;
      color: #714b1e;
    }

    .vowel {
      display: inline-block;
      padding: 0.1rem 0.2rem;
      border-radius: 3px;
      background: #b9dfb5;
      color: #245c2a;
      line-height: 1.1;
    }

    .part .vowel {
      margin-left: 0.05rem;
    }

    .guess {
      color: #714b1e;
      font-style: italic;
    }

    .override {
      display: flex;
      gap: 0.5rem;
    }

    .override input {
      width: 100%;
      padding: 0.45rem;
      border: 1px solid #c8a66a;
      border-radius: 4px;
      font: inherit;
    }

    .override select {
      padding: 0.45rem;
      border: 1px solid #c8a66a;
      border-radius: 4px;
      color: inherit;
      background: #fff;
      font: inherit;
      font-size: 0.9rem;
    }

    .override button {
      padding: 0.45rem 0.7rem;
      white-space: nowrap;
    }

    .segment-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 0.4rem;
    }

    .segment-actions button {
      padding: 0.35rem 0.55rem;
      background: #55758d;
      font-size: 0.85rem;
    }

    .structure-editor {
      display: flex;
      flex-direction: column;
      width: 100%;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .editor-row {
      display: grid;
      grid-template-columns: minmax(90px, 1fr) minmax(120px, 1fr) minmax(120px, 2fr) auto;
      gap: 0.4rem;
      align-items: center;
    }

    .structure-editor input,
    .structure-editor select,
    .structure-editor button {
      box-sizing: border-box;
      font-size: 1rem;
    }

    .type-picker {
      position: relative;
      align-self: stretch;
    }

    .type-picker > button {
      width: 100%;
      height: 100%;
      padding: 0.75rem;
      border: 1px solid #8aaabd;
      border-radius: 4px;
      color: #183b56;
      background: #fff;
      font: inherit;
      font-size: 0.85rem !important;
      font-weight: bold;
      text-align: left;
    }

    .type-menu {
      position: absolute;
      z-index: 2;
      top: calc(100% + 0.25rem);
      right: 0;
      left: 0;
      display: none;
      padding: 0.25rem;
      border: 1px solid #8aaabd;
      border-radius: 4px;
      background: #fff;
      box-shadow: 0 4px 10px rgba(24, 59, 86, 0.15);
      font-size: 0.85rem !important;
      line-height: 1.2;
    }

    .type-picker.open .type-menu {
      display: grid;
      gap: 0.2rem;
    }

    .type-menu button {
      padding: 0.45rem;
      border: 0;
      border-radius: 3px;
      color: #183b56;
      background: transparent;
      font-family: Arial, sans-serif;
      font-size: 0.85rem !important;
      line-height: 1.2;
      text-align: left;
    }

    .type-menu button:hover,
    .type-menu button:focus {
      background: #dceff4;
    }

    .editor-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .editor-actions button,
    .remove-segment {
      padding: 0.45rem 0.65rem;
      background: #55758d;
      font-size: 0.85rem;
    }

    .remove-segment {
      background: #9a4f4f;
    }

    @media (max-width: 560px) {
      .editor-row {
        grid-template-columns: 1fr 1fr;
      }

      .editor-row input:first-child {
        grid-column: 1 / -1;
      }
    }

    .segment-actions input {
      width: 4.5rem;
      padding: 0.35rem;
      border: 1px solid #8aaabd;
      border-radius: 4px;
      font: inherit;
    }

    .plus {
      color: #55758d;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 0.75rem;
      border-bottom: 1px solid #dce8ee;
      text-align: left;
      vertical-align: top;
    }

    th {
      color: #0b5c75;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .note {
      margin-bottom: 0;
      color: #55758d;
    }

    #status {
      color: #55758d;
    }

    @media (max-width: 560px) {
      .search-row {
        flex-direction: column;
      }

      th,
      td {
        padding: 0.6rem 0.4rem;
      }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Medical Term Breakdown</p>
    <h1>Break Down a Medical Term</h1>
    <p class="intro">Enter a completed medical term to see its word parts and definitions. The page can suggest and learn unknown parts.</p>

    <form id="term-form">
      <div class="search-row">
        <label class="sr-only" for="term-input">Medical term</label>
        <input id="term-input" type="search" value="pneumonia" placeholder="Try pneumonia or tachycardia" autocomplete="off">
        <button type="submit">Break down</button>
        <button id="speak-term" type="button">Speak</button>
      </div>
    </form>

    <section aria-labelledby="breakdown-heading">
      <h2 id="breakdown-heading">Break the word apart</h2>
      <div id="term-display" class="term" aria-live="polite"></div>
      <p id="status" role="status">Ready</p>
      <table>
        <thead>
          <tr>
            <th scope="col">Part</th>
            <th scope="col">Definition</th>
          </tr>
        </thead>
        <tbody id="breakdown-rows"></tbody>
      </table>
      <p id="summary" class="note"></p>
    </section>

  </main>

  <script src="medical-word-parts.js"></script>
  <script>
    const form = document.querySelector('#term-form');
    const termInput = document.querySelector('#term-input');
    const termDisplay = document.querySelector('#term-display');
    const breakdownRows = document.querySelector('#breakdown-rows');
    const status = document.querySelector('#status');
    const summary = document.querySelector('#summary');
    const speakTermButton = document.querySelector('#speak-term');
    const wordParts = wordPartData.map(({ part, definition }) => ({ part, word: normalize(part), definition }));

    function normalize(value) {
      return value.toLowerCase().replace(/[^a-z]/g, '');
    }

    function speakTerm() {
      const spokenTerm = termInput.value.trim();
      if (!spokenTerm) return;
      if (!('speechSynthesis' in window) || !('SpeechSynthesisUtterance' in window)) {
        status.textContent = 'Speech is not available in this browser.';
        return;
      }
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(spokenTerm);
      utterance.lang = 'en-US';
      utterance.rate = 0.78;
      utterance.pitch = 1;
      utterance.onstart = () => { status.textContent = `Reading: ${spokenTerm}`; };
      utterance.onend = () => { status.textContent = 'Finished reading.'; };
      utterance.onerror = () => { status.textContent = 'The browser could not read this term.'; };
      window.speechSynthesis.speak(utterance);
    }

    function getWordBoundaries(value) {
      const boundaries = new Set();
      let position = 0;
      value.split(/[^a-z]+/i).filter(Boolean).forEach((word, index) => {
        if (index > 0) boundaries.add(position);
        position += normalize(word).length;
      });
      return boundaries;
    }

    function segmentTerm(term) {
      const memo = new Map();
      function solve(position) {
        if (position === term.length) return { segments: [], score: 0 };
        if (memo.has(position)) return memo.get(position);

        const candidates = getMatchesAt(term, position).map((entry) => {
          const next = solve(position + entry.word.length);
          return {
            segments: [{ text: term.slice(position, position + entry.word.length), entry }, ...next.segments],
            score: next.score + entry.word.length * 1000 + entry.word.length ** 2 + (isSuffix(entry) ? 80 : 0)
          };
        });

        getUnknownEnds(term, position).forEach((end) => {
          const next = solve(end);
          const text = term.slice(position, end);
          candidates.push({
            segments: [{ text, entry: null, guess: guessDefinition(text, term, position) }, ...next.segments],
            score: next.score - text.length * 100
          });
        });

        const best = candidates.sort((first, second) => second.score - first.score)[0];
        memo.set(position, best);
        return best;
      }
      const repaired = repairShortGuesses(solve(0).segments);
      return annotateLinkingVowels(repaired);
    }

    function annotateLinkingVowels(segments) {
      return segments.map((segment, index) => {
        const isVowel = !segment.entry && /^[aeiouy]$/.test(segment.text);
        const betweenParts = segments[index - 1]?.entry && segments[index + 1]?.entry;
        return isVowel && betweenParts
          ? { ...segment, vowel: true, guess: 'linking vowel' }
          : segment;
      });
    }

    function repairShortGuesses(segments) {
      let changed = true;
      while (changed) {
        changed = false;
        for (let index = 0; index < segments.length; index += 1) {
          const segment = segments[index];
          if (segment.entry || segment.text.length > 2) continue;
          const previous = segments[index - 1];
          const next = segments[index + 1];
          const combinations = [
            { indexes: [index - 1, index], text: `${previous?.text || ''}${segment.text}` },
            { indexes: [index, index + 1], text: `${segment.text}${next?.text || ''}` },
            { indexes: [index - 1, index, index + 1], text: `${previous?.text || ''}${segment.text}${next?.text || ''}` }
          ];
          const match = combinations
            .filter((combination) => combination.indexes.every((partIndex) => segments[partIndex]))
            .map((combination) => ({ ...combination, entry: findExactPart(combination.text) }))
            .filter((combination) => combination.entry)
            .sort((first, second) => second.text.length - first.text.length)[0];
          if (match) {
            const firstIndex = Math.min(...match.indexes);
            const lastIndex = Math.max(...match.indexes);
            segments.splice(firstIndex, lastIndex - firstIndex + 1, {
              text: match.text,
              entry: match.entry
            });
            changed = true;
            break;
          }
        }
      }
      return segments;
    }

    function findExactPart(text) {
      const normalizedText = normalize(text);
      return wordParts.find((entry) => entry.word === normalizedText);
    }

    function isSuffix(entry) {
      return entry.part.trim().startsWith('-');
    }

    function getMatchesAt(term, position) {
      return wordParts.filter((entry) => {
        const endsTerm = position + entry.word.length === term.length;
        return term.startsWith(entry.word, position) && (!isSuffix(entry) || endsTerm);
      });
    }

    function getUnknownEnds(term, position) {
      const ends = new Set([term.length]);
      for (let end = position + 1; end < term.length; end += 1) {
        const startsPart = getMatchesAt(term, end).length > 0;
        const vowelBoundary = /[aeiouy]/.test(term[end - 1]);
        if (startsPart || vowelBoundary) ends.add(end);
      }
      return [...ends].sort((first, second) => first - second);
    }

    function guessDefinition(text, term, position) {
      const remaining = term.slice(position);
      const clues = [
        [/itis$/, 'inflammation'], [/emia$/, 'blood condition'], [/algia$/, 'pain'],
        [/dynia$/, 'pain'], [/osis$/, 'condition or abnormal process'], [/oma$/, 'tumor or mass'],
        [/pnea$/, 'breathing'], [/megaly$/, 'enlargement'], [/ectomy$/, 'surgical removal'],
        [/otomy$/, 'surgical incision'], [/ostomy$/, 'surgical opening'], [/scopy$/, 'visual examination'],
        [/pathy$/, 'disease'], [/therapy$/, 'treatment'], [/lysis$/, 'breakdown or destruction'],
        [/rrhea$/, 'flow or discharge'], [/rrhage$/, 'bleeding'], [/uria$/, 'urine-related condition'],
        [/cyte$/, 'cell'], [/plasia$/, 'formation or growth'], [/trophy$/, 'growth or nourishment'],
        [/praxia$/, 'movement or coordination'], [/plegia$/, 'paralysis'], [/penia$/, 'deficiency'],
        [/cardi/, 'heart'], [/pneum/, 'air or lung'], [/bronch/, 'airway'], [/nephr/, 'kidney'],
        [/hepat/, 'liver'], [/derm/, 'skin'], [/oste/, 'bone'], [/arthr/, 'joint'],
        [/gastr/, 'stomach'], [/enter/, 'intestine'], [/neur/, 'nerve'], [/my/, 'muscle'],
        [/angi/, 'blood vessel'], [/rhin/, 'nose'], [/ophthalm/, 'eye'], [/cyt/, 'cell']
      ];
      const match = clues.find(([pattern]) => pattern.test(text) || pattern.test(remaining));
      if (match) return match[1];

      const affixClues = [
        [/^(hyper|super)/, 'above, excessive, or increased'], [/^(hypo|sub)/, 'below, deficient, or decreased'],
        [/^(brady)/, 'slow'], [/^(tachy)/, 'fast'], [/^(dys|mal)/, 'difficult, abnormal, or impaired'],
        [/^(poly)/, 'many or excessive'], [/^(mono)/, 'one'], [/^(peri)/, 'around'],
        [/^(endo|intra)/, 'within'], [/^(ecto|extra)/, 'outside'], [/^(inter)/, 'between'],
        [/^(anti)/, 'against'], [/^(micro)/, 'small'], [/^(macro)/, 'large'],
        [/(logy|ology)$/, 'study or description of'], [/(ac|al|eal|ial|ous|ity)$/, 'pertaining to']
      ];
      const affix = affixClues.find(([pattern]) => pattern.test(text) || pattern.test(remaining));
      if (affix) return affix[1];

      const atStart = position === 0;
      const atEnd = position + text.length === term.length;
      if (atEnd) return 'a condition or process involving the preceding word parts';
      if (atStart) return 'a modifier describing the following word parts';
      return 'an anatomical structure or process described by the surrounding word parts';
    }

    function renderBreakdown() {
      const term = normalize(termInput.value);
      if (!term) {
        status.textContent = 'Enter a medical term to begin.';
        termDisplay.replaceChildren();
        breakdownRows.replaceChildren();
        summary.textContent = '';
        return;
      }

      const segments = segmentTerm(term);
      const wordBoundaries = getWordBoundaries(termInput.value);
      termDisplay.replaceChildren();
      breakdownRows.replaceChildren();
      const definitions = [];
      let hasUnmatched = false;
      let renderedTermLength = 0;

      let displayedPartCount = 0;
      let lastDisplayedPart = null;
      let lastSegmentLabel = null;
      segments.forEach((segment, index) => {
        if (segment.vowel) {
          if (lastDisplayedPart) {
            const vowel = document.createElement('span');
            vowel.className = 'vowel';
            vowel.textContent = segment.text;
            vowel.title = 'Linking vowel';
            lastDisplayedPart.append(vowel);
            lastSegmentLabel.textContent += ' + linking vowel';
          }
          renderedTermLength += segment.text.length;
          return;
        }
        const definition = segment.entry?.definition;
        const segmentType = getSegmentType(segments, index);
        if (displayedPartCount > 0) {
          const plus = document.createElement('span');
          plus.className = 'plus';
          plus.textContent = wordBoundaries.has(renderedTermLength) ? ' ' : '+';
          termDisplay.append(plus);
        }
        const segmentDisplay = document.createElement('span');
        segmentDisplay.className = 'segment-display';
        const displayPart = document.createElement('span');
        displayPart.className = definition ? 'part' : 'unmatched';
        displayPart.textContent = segment.text;
        const segmentLabel = document.createElement('span');
        segmentLabel.className = 'segment-label';
        segmentLabel.textContent = segmentType;
        segmentDisplay.append(displayPart, segmentLabel);
        termDisplay.append(segmentDisplay);
        lastDisplayedPart = displayPart;
        lastSegmentLabel = segmentLabel;
        displayedPartCount += 1;
        renderedTermLength += segment.text.length;

        const row = document.createElement('tr');
        const partCell = document.createElement('td');
        const definitionCell = document.createElement('td');
        if (definition) {
          partCell.textContent = segment.entry ? segment.entry.part : segment.text;
          definitionCell.textContent = definition;
          definitions.push(definition);
        } else {
          partCell.textContent = `${segment.text} (guessed)`.trim();
          definitionCell.innerHTML = '';
          const guess = document.createElement('span');
          guess.className = 'guess';
          guess.textContent = `Suggested: ${segment.guess}`;
          definitionCell.append(guess);
          const inferenceNote = document.createElement('small');
          inferenceNote.className = 'note';
          inferenceNote.textContent = 'Inferred from spelling, position, and nearby word parts.';
          definitionCell.append(document.createElement('br'), inferenceNote);
          definitions.push(segment.guess);
          hasUnmatched = true;
        }
        row.append(partCell, definitionCell);
        breakdownRows.append(row);
      });

      const recognizedCount = segments.filter((segment) => segment.entry).length;
      const inferredCount = segments.filter((segment) => !segment.entry && !segment.vowel).length;
      status.textContent = `${recognizedCount} recognized word part(s), ${inferredCount} context-inferred part(s)`;
      summary.textContent = hasUnmatched
        ? 'Inferred parts use reusable medical morphology and word position. Add an override when you know a more precise definition.'
        : `Definitions combined: ${definitions.join(' + ')}.`;
    }

    function getSegmentType(segments, index) {
      const segment = segments[index];
      if (segment.editorType) return segment.editorType;
      if (segment.vowel) return 'linking vowel';
      const partIndexes = segments
        .map((candidate, candidateIndex) => candidate.vowel ? -1 : candidateIndex)
        .filter((candidateIndex) => candidateIndex >= 0);
      if (partIndexes.length === 1) return 'root';
      if (index === partIndexes[0]) return 'prefix';
      if (index === partIndexes[partIndexes.length - 1]) return 'suffix';
      return 'root';
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      renderBreakdown();
      speakTerm();
    });
    speakTermButton.addEventListener('click', speakTerm);
    status.textContent = `${wordParts.length} built-in word parts ready`;
    renderBreakdown();
  </script>
</body>
</html>
