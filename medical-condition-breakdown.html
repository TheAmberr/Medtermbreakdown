      <div class="options-row">

        <label class="merge-option" for="edit-terms">
          <input id="edit-terms" type="checkbox">
          Edit definitions
        </label>
      </div>

    let wordFileHandle = null;
    let externalWordParts = [];

    function normalize(value) {
      return value.toLowerCase().replace(/[^a-z]/g, '');
    }

    function speakTerm() {
      const spokenTerm = termInput.value.trim();
      if (!spokenTerm) return;
      if (!('speechSynthesis' in window) || !('SpeechSynthesisUtterance' in window)) {
        status.textContent = 'Speech is not available in this browser.';
        return;
      }
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(spokenTerm);
      utterance.lang = 'en-US';
      utterance.rate = 0.78;
      utterance.pitch = 1;
      utterance.onstart = () => { status.textContent = `Reading: ${spokenTerm}`; };
      utterance.onend = () => { status.textContent = 'Finished reading.'; };
      utterance.onerror = () => { status.textContent = 'The browser could not read this term.'; };
      window.speechSynthesis.speak(utterance);
    }

    function getWordBoundaries(value) {
      const boundaries = new Set();
      let position = 0;
      value.split(/[^a-z]+/i).filter(Boolean).forEach((word, index) => {
        if (index > 0) boundaries.add(position);
        position += normalize(word).length;
      });
      return boundaries;
    }

    function parseWordFile(text) {
      try {
        const parsed = JSON.parse(text);
        const entries = Array.isArray(parsed) ? parsed : Object.entries(parsed).map(([part, definition]) => ({ part, definition }));
        return entries
          .map((entry) => ({ part: String(entry.part || entry.word || '').trim(), definition: String(entry.definition || '').trim() }))
          .filter((entry) => entry.part && entry.definition);
      } catch (error) {
        return text.split(/\r?\n/)
          .map((line) => line.trim())
          .filter((line) => line && !line.startsWith('#'))
          .map((line) => line.split(/\t|\s{2,}|\s+-\s+/))
          .filter((columns) => columns.length >= 2 && columns[0].trim() && columns.slice(1).join(' ').trim())
          .map(([part, ...definition]) => ({ part: part.trim(), definition: definition.join(' ').trim() }));
      }
    }

    function addExternalWordParts(entries) {
      externalWordParts = entries.map(({ part, definition }) => ({
        part,
        word: normalize(part),
        definition
      }));
      externalWordParts.forEach((entry) => {
        const existingIndex = wordParts.findIndex((candidate) => candidate.word === entry.word);
        if (existingIndex >= 0) wordParts[existingIndex] = entry;
        else wordParts.push(entry);
      });
    }

    function getWordFileText() {
      const entries = new Map();
      wordParts.forEach((entry) => entries.set(entry.word, { part: entry.part, definition: entry.definition }));
      externalWordParts.forEach((entry) => entries.set(entry.word, { part: entry.part, definition: entry.definition }));
      Object.values(manualBreakdowns).flat().forEach((segment) => {
        if (!segment.entry?.word || !segment.entry.definition || segment.vowel) return;
        entries.set(segment.entry.word, { part: segment.entry.part, definition: segment.entry.definition });
      });
      Object.entries(overrides).forEach(([key, value]) => {
        const [term, segment] = key.split(':');
        const override = getOverride(key);
        if (!segment || !override?.definition) return;
        const part = override.type === 'prefix' ? `${segment}-` : override.type === 'suffix' ? `-${segment}` : segment;
        entries.set(normalize(part), { part, definition: override.definition });
      });
      return [...entries.values()]
        .sort((first, second) => normalize(first.part).localeCompare(normalize(second.part)))
        .map(({ part, definition }) => `${part}\t${definition}`)
        .join('\n') + '\n';
    }

    async function writeWordFile() {
      const text = getWordFileText();
      if (wordFileHandle) {
        const writable = await wordFileHandle.createWritable();
        await writable.write(text);
        await writable.close();
        status.textContent = 'Vocabulary file updated.';
        return;
      }
      const link = document.createElement('a');
      link.href = URL.createObjectURL(new Blob([text], { type: 'text/plain' }));
      link.download = 'medical-word-parts.txt';
      link.click();
      URL.revokeObjectURL(link.href);
      status.textContent = 'Updated vocabulary downloaded as medical-word-parts.txt.';

    async function loadWordFile(file) {
      if (!file) return;
      addExternalWordParts(parseWordFile(await file.text()));
      renderBreakdown();
      status.textContent = `${externalWordParts.length} word part(s) loaded from ${file.name}.`;

    function segmentTerm(term) {
      if (manualBreakdowns[term]) {
        return manualBreakdowns[term].map((segment) => ({
          ...segment,
          entry: segment.entry ? { ...segment.entry } : null
        }));
      }
      const memo = new Map();
      function solve(position) {
        if (position === term.length) return { segments: [], score: 0 };
        if (memo.has(position)) return memo.get(position);

        const candidates = getMatchesAt(term, position).map((entry) => {
          const next = solve(position + entry.word.length);
          return {
            segments: [{ text: term.slice(position, position + entry.word.length), entry }, ...next.segments],
            score: next.score + entry.word.length * 1000 + entry.word.length ** 2 + (isSuffix(entry) ? 80 : 0)
          };
        });

        getUnknownEnds(term, position).forEach((end) => {
          const next = solve(end);
          const text = term.slice(position, end);
          candidates.push({
            segments: [{ text, entry: null, guess: guessDefinition(text, term, position) }, ...next.segments],
            score: next.score - text.length * 100
          });
        });

        const best = candidates.sort((first, second) => second.score - first.score)[0];
        memo.set(position, best);
        return best;
      }
      const repaired = repairShortGuesses(solve(0).segments);
      const merged = mergeUnknownInput.checked ? mergeUnknownSegments(repaired) : repaired;
      return annotateLinkingVowels(merged);
    }

    function mergeUnknownSegments(segments) {
      const merged = [];
      segments.forEach((segment) => {
        const previous = merged[merged.length - 1];
        if (previous && !previous.entry && !previous.vowel && !segment.entry && !segment.vowel) {
          previous.text += segment.text;
          previous.guess = guessDefinition(previous.text, previous.text, 0);
        } else {
          merged.push({ ...segment });
        }
      });
      return merged;
    }

    function annotateLinkingVowels(segments) {
      return segments.map((segment, index) => {
        const isVowel = !segment.entry && /^[aeiouy]$/.test(segment.text);
        const betweenParts = segments[index - 1]?.entry && segments[index + 1]?.entry;
        return isVowel && betweenParts
          ? { ...segment, vowel: true, guess: 'linking vowel' }
          : segment;
      });
    }

    function repairShortGuesses(segments) {
      let changed = true;
      while (changed) {
        changed = false;
        for (let index = 0; index < segments.length; index += 1) {
          const segment = segments[index];
          if (segment.entry || segment.text.length > 2) continue;
          const previous = segments[index - 1];
          const next = segments[index + 1];
          const combinations = [
            { indexes: [index - 1, index], text: `${previous?.text || ''}${segment.text}` },
            { indexes: [index, index + 1], text: `${segment.text}${next?.text || ''}` },
            { indexes: [index - 1, index, index + 1], text: `${previous?.text || ''}${segment.text}${next?.text || ''}` }
          ];
          const match = combinations
            .filter((combination) => combination.indexes.every((partIndex) => segments[partIndex]))
            .map((combination) => ({ ...combination, entry: findExactPart(combination.text) }))
            .filter((combination) => combination.entry)
            .sort((first, second) => second.text.length - first.text.length)[0];
          if (match) {
            const firstIndex = Math.min(...match.indexes);
            const lastIndex = Math.max(...match.indexes);
            segments.splice(firstIndex, lastIndex - firstIndex + 1, {
              text: match.text,
              entry: match.entry
            });
            changed = true;
            break;
          }
        }
      }
      return segments;
    }

    function findExactPart(text) {
      const normalizedText = normalize(text);
      return wordParts.find((entry) => entry.word === normalizedText);

    function isSuffix(entry) {
      return entry.part.trim().startsWith('-');
    }

    function getMatchesAt(term, position) {
      return wordParts.filter((entry) => {
        const endsTerm = position + entry.word.length === term.length;
        return term.startsWith(entry.word, position) && (!isSuffix(entry) || endsTerm);
      });

    function getUnknownEnds(term, position) {
      const ends = new Set([term.length]);
      for (let end = position + 1; end < term.length; end += 1) {

        const vowelBoundary = /[aeiouy]/.test(term[end - 1]);
        if (startsPart || vowelBoundary) ends.add(end);

      return [...ends].sort((first, second) => first - second);

        [/gastr/, 'stomach'], [/enter/, 'intestine'], [/neur/, 'nerve'], [/my/, 'muscle'],

      const match = clues.find(([pattern]) => pattern.test(text) || pattern.test(remaining));
      if (match) return match[1];

      const affixClues = [
        [/^(hyper|super)/, 'above, excessive, or increased'], [/^(hypo|sub)/, 'below, deficient, or decreased'],
        [/^(brady)/, 'slow'], [/^(tachy)/, 'fast'], [/^(dys|mal)/, 'difficult, abnormal, or impaired'],
        [/^(poly)/, 'many or excessive'], [/^(mono)/, 'one'], [/^(peri)/, 'around'],
        [/^(endo|intra)/, 'within'], [/^(ecto|extra)/, 'outside'], [/^(inter)/, 'between'],
        [/^(anti)/, 'against'], [/^(micro)/, 'small'], [/^(macro)/, 'large'],
        [/(logy|ology)$/, 'study or description of'], [/(ac|al|eal|ial|ous|ity)$/, 'pertaining to']

      const affix = affixClues.find(([pattern]) => pattern.test(text) || pattern.test(remaining));
      if (affix) return affix[1];

      const atStart = position === 0;
      const atEnd = position + text.length === term.length;
      if (atEnd) return 'a condition or process involving the preceding word parts';
      if (atStart) return 'a modifier describing the following word parts';
      return 'an anatomical structure or process described by the surrounding word parts';

    function renderBreakdown() {
      const term = normalize(termInput.value);
      if (!term) {
        status.textContent = 'Enter a medical term to begin.';
        termDisplay.replaceChildren();
        breakdownRows.replaceChildren();
        summary.textContent = '';
        return;
      }

      const segments = segmentTerm(term);
      const wordBoundaries = getWordBoundaries(termInput.value);
      termDisplay.replaceChildren();
      breakdownRows.replaceChildren();
      const definitions = [];
      let hasUnmatched = false;
      let renderedTermLength = 0;

      let displayedPartCount = 0;
      let lastDisplayedPart = null;
      let lastSegmentLabel = null;
      segments.forEach((segment, index) => {
        if (segment.vowel) {
          if (lastDisplayedPart) {
            const vowel = document.createElement('span');
            vowel.className = 'vowel';
            vowel.textContent = segment.text;
            vowel.title = 'Linking vowel';
            lastDisplayedPart.append(vowel);
            lastSegmentLabel.textContent += ' + linking vowel';
          }
          renderedTermLength += segment.text.length;
          return;
        }
        const key = `${term}:${segment.text}`;
        const savedOverride = getOverride(key);
        const definition = savedOverride?.definition || segment.entry?.definition;
        const savedType = savedOverride?.type;
        const segmentType = savedType || getSegmentType(segments, index);
        if (displayedPartCount > 0) {
          const plus = document.createElement('span');
          plus.className = 'plus';
          plus.textContent = wordBoundaries.has(renderedTermLength) ? ' ' : '+';
          termDisplay.append(plus);
        }
        const segmentDisplay = document.createElement('span');
        segmentDisplay.className = 'segment-display';
        const displayPart = document.createElement('span');
        displayPart.className = definition ? 'part' : 'unmatched';
        displayPart.textContent = segment.text;
        const segmentLabel = document.createElement('span');
        segmentLabel.className = 'segment-label';
        segmentLabel.textContent = segmentType;
        segmentDisplay.append(displayPart, segmentLabel);
        termDisplay.append(segmentDisplay);
        lastDisplayedPart = displayPart;
        lastSegmentLabel = segmentLabel;
        displayedPartCount += 1;
        renderedTermLength += segment.text.length;

        const row = document.createElement('tr');
        const partCell = document.createElement('td');
        const definitionCell = document.createElement('td');
        if (definition) {
          partCell.textContent = segment.entry ? segment.entry.part : segment.text;
          definitionCell.textContent = definition;
          definitions.push(definition);
          if (editTermsInput.checked) {
            addDefinitionEditor(definitionCell, key, definition, segment.text, segmentType);
          }
        } else {
          partCell.textContent = `${segment.text} (guessed)`.trim();
          definitionCell.innerHTML = '';
          const guess = document.createElement('span');
          guess.className = 'guess';
          guess.textContent = `Suggested: ${segment.guess}`;
          definitionCell.append(guess);
          const inferenceNote = document.createElement('small');
          inferenceNote.className = 'note';
          inferenceNote.textContent = 'Inferred from spelling, position, and nearby word parts.';
          definitionCell.append(document.createElement('br'), inferenceNote);
          if (!editTermsInput.checked) {
            addDefinitionEditor(definitionCell, key, segment.guess, segment.text, segmentType);
          }
          definitions.push(segment.guess);
          hasUnmatched = true;
        }
        row.append(partCell, definitionCell);
        breakdownRows.append(row);
      });

      const recognizedCount = segments.filter((segment) => segment.entry).length;
      const inferredCount = segments.filter((segment) => !segment.entry && !segment.vowel).length;
      status.textContent = `${recognizedCount} recognized word part(s), ${inferredCount} context-inferred part(s)`;
      summary.textContent = hasUnmatched
        ? 'Inferred parts use reusable medical morphology and word position. Add an override when you know a more precise definition.'
        : `Definitions combined: ${definitions.join(' + ')}.`;
      if (editTermsInput.checked) addStructureEditor(term, segments);
    }

    function addStructureEditor(term, segments) {
      termDisplay.replaceChildren();
      const editor = document.createElement('div');
      editor.className = 'structure-editor';
      const workingSegments = segments.map((segment) => ({ ...segment }));

      function renderEditorRows() {
        editor.querySelectorAll('.editor-row').forEach((row) => row.remove());
        workingSegments.forEach((segment, index) => {
          const row = document.createElement('div');
          row.className = 'editor-row';
          const textInput = document.createElement('input');
          textInput.value = segment.text;
          textInput.setAttribute('aria-label', `Segment ${index + 1}`);
          const type = segment.editorType || getSegmentType(workingSegments, index);
          const typePicker = createTypePicker(type, `Type for segment ${index + 1}`, (nextType) => { segment.editorType = nextType; });
          const definitionInput = document.createElement('input');
          definitionInput.value = segment.editorDefinition || getOverride(`${term}:${segment.text}`)?.definition || segment.entry?.definition || segment.guess || '';
          definitionInput.placeholder = 'Definition';
          definitionInput.setAttribute('aria-label', `Definition for segment ${index + 1}`);
          const removeButton = document.createElement('button');
          removeButton.className = 'remove-segment';
          removeButton.type = 'button';
          removeButton.textContent = 'Remove';
          removeButton.addEventListener('click', () => {
            workingSegments.splice(index, 1);
            renderEditorRows();
          });
          row.append(textInput, typePicker, definitionInput, removeButton);
          editor.append(row);
          textInput.addEventListener('input', () => { segment.text = normalize(textInput.value); });
          definitionInput.addEventListener('input', () => { segment.editorDefinition = definitionInput.value; });
        });
      }

      const actionBar = document.createElement('div');
      actionBar.className = 'editor-actions';
      ['Add prefix', 'Add root', 'Add suffix'].forEach((label) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = label;
        button.addEventListener('click', () => {
          workingSegments.push({ text: '', entry: null, guess: '', editorType: label.slice(4).toLowerCase(), editorDefinition: '' });
          renderEditorRows();
        });
        actionBar.append(button);
      });
      const saveButton = document.createElement('button');
      saveButton.type = 'button';
      saveButton.textContent = 'Save breakdown';
      saveButton.addEventListener('click', () => {
        const normalizedParts = workingSegments.filter((segment) => segment.text).map((segment, index) => {
          const text = normalize(segment.text);
          const type = segment.editorType || getSegmentType(workingSegments, index);
          const definition = segment.editorDefinition || segment.guess || guessDefinition(text, term, 0);
          const knownEntry = findExactPart(text);
          const entry = type === 'linking vowel' ? null : knownEntry
            ? { ...knownEntry, definition: segment.editorDefinition || knownEntry.definition }
            : {
              part: type === 'prefix' ? `${text}-` : type === 'suffix' ? `-${text}` : text,
              word: text,
              definition
            };
          if (entry && segment.editorDefinition) entry.definition = definition;
          return { text, entry, guess: definition, vowel: type === 'linking vowel', editorType: type, editorDefinition: segment.editorDefinition || '' };
        });
        if (!normalizedParts.length) return;
        saveManualBreakdown(term, normalizedParts);
        renderBreakdown();
      });
      actionBar.append(saveButton);
      editor.append(actionBar);
      renderEditorRows();
      termDisplay.append(editor);
    }

    function getPartType(entry) {
      const part = entry.part.trim();
      if (part.startsWith('-')) return 'suffix';
      if (part.endsWith('-')) return 'prefix';
      return 'root';
    }

    function getSegmentType(segments, index) {
      const segment = segments[index];
      if (segment.editorType) return segment.editorType;
      if (segment.vowel) return 'linking vowel';
      const partIndexes = segments
        .map((candidate, candidateIndex) => candidate.vowel ? -1 : candidateIndex)
        .filter((candidateIndex) => candidateIndex >= 0);
      if (partIndexes.length === 1) return 'root';
      if (index === partIndexes[0]) return 'prefix';
      if (index === partIndexes[partIndexes.length - 1]) return 'suffix';
      return 'root';
    }

    function getOverride(key) {
      const value = overrides[key];
      if (!value) return null;
      return typeof value === 'string' ? { definition: value, type: 'root' } : value;
    }

    function addDefinitionEditor(container, key, definition, part, type) {
      const editor = document.createElement('div');
      editor.className = 'override';
      const input = document.createElement('input');
      input.value = getOverride(key)?.definition || '';
      input.placeholder = definition;
      input.title = `Current definition: ${definition}`;
      input.setAttribute('aria-label', `Definition for ${part}`);
      let selectedType = type;
      const typePicker = createTypePicker(type, `Type for ${part}`, (nextType) => { selectedType = nextType; });
      const saveButton = document.createElement('button');
      saveButton.type = 'button';
      saveButton.textContent = 'Save';
      saveButton.addEventListener('click', async () => {
        const nextDefinition = input.value.trim() || input.placeholder;
        overrides[key] = { definition: nextDefinition, type: selectedType };
        localStorage.setItem('medicalTermOverrides', JSON.stringify(overrides));
        renderBreakdown();
        if (wordFileHandle) {
          try {
            await writeWordFile();
          } catch (error) {
            status.textContent = 'Saved locally, but the vocabulary file could not be updated.';
          }
        }
      });
      editor.append(input, typePicker, saveButton);
      container.append(document.createElement('br'), editor);
    }

    function createTypePicker(selectedType, label, onChange) {
      const picker = document.createElement('div');
      picker.className = 'type-picker';
      const toggle = document.createElement('button');
      toggle.type = 'button';
      toggle.textContent = selectedType[0].toUpperCase() + selectedType.slice(1);
      toggle.setAttribute('aria-label', label);
      toggle.setAttribute('aria-expanded', 'false');
      const menu = document.createElement('div');
      menu.className = 'type-menu';
      ['prefix', 'root', 'suffix', 'linking vowel'].forEach((type) => {
        const option = document.createElement('button');
        option.type = 'button';
        option.textContent = type[0].toUpperCase() + type.slice(1);
        option.addEventListener('click', () => {
          toggle.textContent = option.textContent;
          picker.classList.remove('open');
          toggle.setAttribute('aria-expanded', 'false');
          onChange(type);
        });
        menu.append(option);
      });
      toggle.addEventListener('click', () => {
        const isOpen = picker.classList.toggle('open');
        toggle.setAttribute('aria-expanded', String(isOpen));
      });
      picker.append(toggle, menu);
      return picker;
    }

    function addSegmentActions(container, term, segments, index) {
      const actions = document.createElement('div');
      actions.className = 'segment-actions';
      const choices = [
        { label: 'Merge previous', offset: -1 },
        { label: 'Merge next', offset: 1 }
      ];
      choices.forEach(({ label, offset }) => {
        const adjacent = segments[index + offset];
        if (!adjacent || adjacent.entry || adjacent.vowel) return;
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = label;
        button.addEventListener('click', () => {
          const first = Math.min(index, index + offset);
          const second = Math.max(index, index + offset);
          segments.splice(first, 2, {
            text: segments[first].text + segments[second].text,
            entry: null,
            guess: guessDefinition(segments[first].text + segments[second].text, term, 0)
          });
          saveManualBreakdown(term, segments);
          renderBreakdown();
        });
        actions.append(button);
      });

      if (segments[index].text.length > 1) {
        const splitInput = document.createElement('input');
        splitInput.type = 'number';
        splitInput.min = '1';
        splitInput.max = String(segments[index].text.length - 1);
        splitInput.placeholder = 'Position';
        splitInput.setAttribute('aria-label', `Split ${segments[index].text} after character`);
        const splitButton = document.createElement('button');
        splitButton.type = 'button';
        splitButton.textContent = 'Split here';
        splitButton.addEventListener('click', () => {
          const splitAt = Number.parseInt(splitInput.value, 10);
          if (!Number.isInteger(splitAt) || splitAt < 1 || splitAt >= segments[index].text.length) return;
          const text = segments[index].text;
          segments.splice(index, 1,
            { text: text.slice(0, splitAt), entry: findExactPart(text.slice(0, splitAt)), guess: guessDefinition(text.slice(0, splitAt), term, 0) },
            { text: text.slice(splitAt), entry: findExactPart(text.slice(splitAt)), guess: guessDefinition(text.slice(splitAt), term, splitAt) }
          );
          saveManualBreakdown(term, segments);
          renderBreakdown();
        });
        actions.append(splitInput, splitButton);
      }
      if (!segments[index].entry) {
        const vowelButton = document.createElement('button');
        vowelButton.type = 'button';
        vowelButton.textContent = 'Mark as linking vowel';
        vowelButton.addEventListener('click', () => {
          segments[index].vowel = true;
          segments[index].guess = 'linking vowel';
          saveManualBreakdown(term, segments);
          renderBreakdown();
        });
        actions.append(vowelButton);
      }
      container.append(actions);
    }

    function saveManualBreakdown(term, segments) {
      manualBreakdowns[term] = segments.map((segment) => ({
        text: segment.text,
        entry: segment.entry ? { ...segment.entry } : null,
        guess: segment.guess,
        vowel: Boolean(segment.vowel),
        editorType: segment.editorType || null
      }));
      localStorage.setItem('medicalTermBreakdowns', JSON.stringify(manualBreakdowns));
      if (wordFileHandle) {
        writeWordFile().catch(() => {
          status.textContent = 'Saved locally, but the vocabulary file could not be updated.';
        });
      }
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      renderBreakdown();
      speakTerm();
    });
    speakTermButton.addEventListener('click', speakTerm);
    mergeUnknownInput.addEventListener('change', renderBreakdown);
    editTermsInput.addEventListener('change', renderBreakdown);
    wordFileInput.addEventListener('change', () => loadWordFile(wordFileInput.files[0]));
    loadWordFileButton.addEventListener('click', async () => {
      if (window.showOpenFilePicker) {
        try {
          [wordFileHandle] = await window.showOpenFilePicker({
            types: [{ description: 'Medical word parts', accept: { 'text/plain': ['.txt'], 'application/json': ['.json'] } }],
            multiple: false
          });
          await loadWordFile(await wordFileHandle.getFile());
          return;
        } catch (error) {
          if (error.name === 'AbortError') return;
        }
      }
      wordFileInput.click();
    });
    saveWordFileButton.addEventListener('click', async () => {
      try {
        await writeWordFile();
      } catch (error) {
        status.textContent = 'Could not update the vocabulary file.';
      }
    });

    status.textContent = `${wordParts.length} built-in word parts ready`;
    renderBreakdown();
  </script>
</body>
</html>
